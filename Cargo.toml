[workspace]
resolver = "2"
members = [
    "core/common",
    "core/ooxml",
    "core/docx",
    "core/pptx",
    "core/xlsx",
    "core/wasm",
    "server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nicetiger/polar-bear-office"

[workspace.dependencies]
# Shared across crates
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

# OOXML processing
quick-xml = { version = "0.37", features = ["serialize"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }

# WASM
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

# Server
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }

# Internal crates
pbo-common = { path = "core/common" }
pbo-ooxml = { path = "core/ooxml" }
pbo-docx = { path = "core/docx" }
pbo-pptx = { path = "core/pptx" }
pbo-xlsx = { path = "core/xlsx" }
