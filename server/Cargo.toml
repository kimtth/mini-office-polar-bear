[package]
name = "pbo-server"
description = "PolarBearOffice API server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "pbo-server"
path = "src/main.rs"

[dependencies]
pbo-common = { workspace = true }
pbo-docx = { workspace = true }
pbo-pptx = { workspace = true }
pbo-xlsx = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
log = { workspace = true }

[dev-dependencies]
http-body-util = "0.1"
tower = { workspace = true, features = ["util"] }
